name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking: the site must build, since this is what gets published.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build
        run: |
          set +e
          bun run build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Surface the error as an annotation so it is readable without log access.
            echo "::error title=Build failed::$(grep -v '^\s*$' build.log | tail -n 25 | sed 's/%/%25/g' | tr '\n' '|')"
          fi
          exit $code

  # Reporting only for now. Existing code has not been through Prettier
  # (enforced via ESLint) and has not been strictly typechecked. Remove
  # `continue-on-error` from each job once a one-time cleanup makes it pass.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
